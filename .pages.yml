media:
  input: media
  output: /media

content:
  - name: homepage
    label: Homepage
    type: file
    path: site.json
    format: json
    fields:
      - name: hero
        label: Startbereich
        type: object
        fields:
          - name: script
            label: Kleine Überschrift
            type: string
          - name: title
            label: Große Überschrift
            type: text
          - name: lead
            label: Unterüberschrift
            type: string
          - name: intro
            label: Beschreibung
            type: text
          - name: button_text
            label: Button-Text
            type: string
          - name: image
            label: Startbild
            type: image

      - name: shop
        label: Shop
        type: object
        fields:
          - name: script
            label: Kleine Überschrift
            type: string
          - name: title
            label: Überschrift
            type: string
          - name: subtitle
            label: Untertext
            type: string

    
      - name: about
        label: Über mich
        type: object
        fields:
          - name: script
            label: Kleine Überschrift
            type: string
          - name: title
            label: Überschrift
            type: string
          - name: paragraph_1
            label: Text 1
            type: text
          - name: paragraph_2
            label: Text 2
            type: text
          - name: highlight
            label: Schlusssatz
            type: text
          - name: image
            label: Bild
            type: image

      - name: contact
        label: Kontakt
        type: object
        fields:
          - name: script
            label: Kleine Überschrift
            type: string
          - name: title
            label: Überschrift
            type: string
          - name: text
            label: Text
            type: text
          - name: instagram_label
            label: Instagram-Anzeige
            type: string
          - name: instagram_url
            label: Instagram-Link
            type: string
          - name: email
            label: E-Mail
            type: string

      - name: footer
        label: Fußbereich
        type: object
        fields:
          - name: logo
            label: Logo
            type: image
          - name: copyright_name
            label: Name
            type: string

  - name: products
    label: Produkte
    type: file
    path: products.json
    format: json
    list: true
    fields:
      - name: id
        label: Interne ID
        type: string
        required: true
      - name: name
        label: Produktname
        type: string
        required: true
      - name: price
        label: Preis in Euro
        type: number
        required: true
      - name: image
        label: Produktfoto
        type: image
        required: true
      - name: images
        label: Weitere Produktbilder
        type: image
        list: true
      - name: description
        label: Beschreibung
        type: text
      - name: badge
        label: Kennzeichnung
        type: string

      - name: category
        label: Hauptkategorie
        type: reference
        options:
          collection: categories
          value: "{id}"
          label: "{fields.name}"

      - name: subcategory
        label: Unterkategorie
        type: reference
        options:
          collection: categories
          value: "{id}"
          label: "{fields.name}"

      - name: available
        label: Verfügbar
        type: boolean
        default: true
      - name: visible
        label: Im Shop anzeigen
        type: boolean
        default: true

  - name: discounts
    label: Rabattcodes
    type: file
    path: discounts.json
    format: json
    list: true
    fields:
      - name: code
        label: Rabattcode
        type: string
        required: true

      - name: percent
        label: Rabatt in Prozent
        type: number
        required: true

      - name: active
        label: Aktiv
        type: boolean
        default: true

      - name: valid_from
        label: Gültig ab
        type: date

      - name: valid_until
        label: Gültig bis
        type: date

      - name: label
        label: Beschreibung
        type: string
        
  - name: shipping
    label: Versand
    type: file
    path: shipping.json
    format: json
    fields:
    
      - name: austria_standard
        label: Österreich – Standardversand
        type: number
        required: true

      - name: austria_premium
        label: Österreich – Premiumversand
        type: number
        required: true

      - name: austria_tracking
        label: Österreich – Sendungsverfolgung
        type: number
        required: true

      - name: eu_registered
        label: EU – Einschreiben inkl. Sendungsverfolgung
        type: number
        required: true

  - name: review_settings
    label: Bewertungsrabatt
    type: file
    path: review-settings.json
    format: json
    fields:
      - name: active
        label: Bewertungsrabatt aktiv
        type: boolean
        default: true

      - name: reward_percent
        label: Rabatt in Prozent
        type: number
        required: true

      - name: valid_days
        label: Gültigkeit in Tagen
        type: number
        required: true

      - name: code_prefix
        label: Anfang des Rabattcodes
        type: string
        required: true
        
  - name: categories
    label: Shop-Kategorien
    type: collection
    path: categories
    format: json
    filename: "{primary}.json"
    view:
      primary: name
    fields:
      - name: id
        label: Interne ID
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"

      - name: name
        label: Name
        type: string
        required: true

      - name: parent
        label: Übergeordnete Kategorie
        type: string

      - name: position
        label: Position
        type: number
        required: true

      - name: active
        label: Im Shop anzeigen
        type: boolean
        default: true

      - name: image
        label: Kategoriebild
        type: image
