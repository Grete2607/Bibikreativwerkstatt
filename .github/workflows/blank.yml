name: Produktbilder KI-Struktur umstellen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Produktbilder umstellen
        run: node convert-images.js

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/*.json

          if git diff --cached --quiet; then
            echo "Keine Produktdateien mussten geändert werden."
          else
            git commit -m "Produktbilder für KI-Kennzeichnung umstellen"
            git push
          fi
