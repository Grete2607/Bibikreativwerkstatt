<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bewertung abgeben | Bibi Kreativwerkstatt</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #faf7fb;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .review-box {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    .intro {
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .stars {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 15px 0 25px;
    }

    .star {
      border: 0;
      background: transparent;
      font-size: 42px;
      cursor: pointer;
      color: #ccc;
      padding: 2px;
    }

    .star.active {
      color: #f2b01e;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font: inherit;
      margin-top: 8px;
    }

    .submit-button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px 20px;
      margin-top: 20px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      background: #76558f;
      color: white;
    }

    .submit-button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <main class="review-box">

    <h1>Wie gefällt dir deine Bestellung? ♡</h1>

    <p class="intro">
      Wir freuen uns sehr über deine Bewertung.
      Vergib Sterne und erzähle uns gerne, wie dir deine
      Bestellung gefällt.
    </p>

    <form id="reviewForm">

      <p><strong>Deine Bewertung</strong></p>

      <div class="stars" id="stars">
        <button type="button" class="star" data-rating="1">★</button>
        <button type="button" class="star" data-rating="2">★</button>
        <button type="button" class="star" data-rating="3">★</button>
        <button type="button" class="star" data-rating="4">★</button>
        <button type="button" class="star" data-rating="5">★</button>
      </div>

      <textarea
        id="comment"
        maxlength="1000"
        placeholder="Schreib uns gerne ein paar Worte zu deiner Bestellung..."
      ></textarea>

      <button type="submit" class="submit-button">
        Bewertung absenden
      </button>

    </form>

  </main>

  <script>
    let selectedRating = 0;

const params = new URLSearchParams(window.location.search);
const reviewToken = params.get("token");

if (!reviewToken) {
  document.getElementById("reviewForm").innerHTML = `
    <p>
      Dieser Bewertungslink ist ungültig oder unvollständig.
    </p>
  `;
}

if (reviewToken) {
  fetch(
    `https://throbbing-breeze-6d1d.bibikreativwerkstatt.workers.dev/review-info?token=${encodeURIComponent(reviewToken)}`
  )
    .then(async response => {
      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error || "Bewertungslink konnte nicht geprüft werden."
        );
      }

      return data;
    })
    .then(data => {
      console.log("Bewertungslink gültig:", data);
    })
    .catch(error => {
  document.getElementById("reviewForm").textContent =
    error.message;
});
}

    
    const stars = document.querySelectorAll(".star");

    stars.forEach(star => {
      star.addEventListener("click", () => {
        selectedRating = Number(star.dataset.rating);

        stars.forEach(item => {
          const rating = Number(item.dataset.rating);

          item.classList.toggle(
            "active",
            rating <= selectedRating
          );
        });
      });
    });

   document
  .getElementById("reviewForm")
  .addEventListener("submit", async event => {
    event.preventDefault();

    if (selectedRating < 1) {
      alert("Bitte wähle zuerst 1 bis 5 Sterne aus.");
      return;
    }

    if (!reviewToken) {
      alert("Dieser Bewertungslink ist ungültig.");
      return;
    }

    const comment =
      document.getElementById("comment").value.trim();

    const submitButton =
      document.querySelector(".submit-button");

    submitButton.disabled = true;
    submitButton.textContent = "Wird gesendet...";

    try {
      const response = await fetch(
        "https://throbbing-breeze-6d1d.bibikreativwerkstatt.workers.dev/review-submit",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token: reviewToken,
            rating: selectedRating,
            comment
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.error || "Bewertung konnte nicht gespeichert werden."
        );
      }

      const reviewForm =
        document.getElementById("reviewForm");

      reviewForm.innerHTML = "";

     const message = document.createElement("p");
message.textContent =
  data.message || "Vielen Dank für deine Bewertung!";

reviewForm.appendChild(message);

if (data.discountCode) {
  const reward = document.createElement("div");

  reward.style.marginTop = "24px";
  reward.style.padding = "20px";
  reward.style.background = "#f7f1fa";
  reward.style.borderRadius = "14px";

  const rewardText = document.createElement("p");
  rewardText.textContent =
    `Als Dankeschön erhältst du ${data.discountPercent} % Rabatt auf deine nächste Bestellung ♡`;

  const code = document.createElement("strong");
  code.textContent = data.discountCode;

  code.style.display = "block";
  code.style.fontSize = "22px";
  code.style.margin = "12px 0";
  code.style.letterSpacing = "1px";
  code.style.color = "#76558f";

  const info = document.createElement("small");
  info.textContent =
    "Dieser Rabattcode kann einmal verwendet werden.";

  reward.appendChild(rewardText);
  reward.appendChild(code);
  reward.appendChild(info);

  reviewForm.appendChild(reward);
}

    } catch (error) {
      alert(error.message);

      submitButton.disabled = false;
      submitButton.textContent = "Bewertung absenden";
    }
  });
  </script>

</body>
</html>
